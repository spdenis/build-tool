spring.main.banner-mode=off
spring.main.web-application-type=none

# Allow // and /* */ comments in repos.json (and any other JSON read by this app).
spring.jackson.parser.allow-comments=true

# Directory where repositories are cloned. Each repo gets a subdirectory named after it.
# The subdirectory is deleted and re-created on every run to guarantee a clean clone.
clone.dir=${user.home}/multibuild-repos

# Default source branch used when a repo entry in repos.json does not specify sourceBranch.
# default.source.branch=main

# Required: integration branch name. The application will fail to start if this is not set.
# If the branch doesn't exist in a repo it will be created from the source branch and all
# pom.xml versions will be set to <branch>-SNAPSHOT.
# Can also be set via the INTEGRATION_BRANCH environment variable.
# integration.branch=

# When true, skips the remote push after committing version changes (all other steps run normally).
# Can also be set via the DRY_MODE environment variable.
dry.mode=false

# What to do when a repo's version doesn't follow the <numeric>-<branch>-SNAPSHOT guideline.
# "fail" (default) — abort and list all offending repos.
# "fix"            — auto-correct the version, commit, and push (respects dry.mode).
snapshot.version.mismatch=fix

# Timeout in seconds for JGit network operations (clone, fetch, push). Default: 120.
# git.timeout=120

# Shallow clone depth. 0 (default) performs a full clone.
# If the repository directory already exists it is reused: changes from a previous run
# are discarded (git reset --hard + git clean) and the remote is fetched instead of re-cloned.
# git.clone.depth=1

# Git implementation: "jgit" (default) uses the embedded JGit library;
# "native" shells out to the git CLI and passes proxy settings as environment variables
# (http_proxy / https_proxy / no_proxy). Use "native" when JGit's HTTP stack is
# incompatible with your server or proxy (e.g. GitHub Enterprise behind a proxy).
# git.implementation=jgit

# Retry settings for the "native" git implementation. Only commands that talk to the
# remote (clone, fetch, ls-remote, push) are retried, with exponential backoff, on failure.
# git.retry.max-attempts=3
# git.retry.initial-backoff-ms=1000
# git.retry.backoff-multiplier=2.0

# Git HTTP proxy — applies only to HTTPS git URLs. SSH is unaffected.
# git.proxy.host=proxy.example.com
# git.proxy.port=8080
# git.proxy.username=
# git.proxy.password=
# Domains that should use the proxy (comma-separated). Leave blank to proxy all HTTPS.
# Subdomain matching is supported: "example.com" also matches "git.example.com".
# git.proxy.domains=github.com,gitlab.com
# Domains that should bypass the proxy (comma-separated).
# git.proxy.bypass=internal.example.com

# Git authentication
# github.token is used both for HTTPS git authentication and for creating pull requests
# via the GitHub API (create-prs command). For GitHub Enterprise the API base URL is
# inferred automatically from the repo host (https://<host>/api/v3).
# github.token=
# Comma-separated GitHub usernames to add as reviewers on every PR opened by the create-prs command.
# Reviewers are also requested when the PR already exists (idempotent).
# github.reviewers=alice,bob
# GitHub API calls are retried with exponential backoff on connection failures and 5xx
# responses (transient/remote errors). 4xx responses are never retried.
# github.retry.max-attempts=3
# github.retry.initial-backoff-ms=1000
# github.retry.backoff-multiplier=2.0
# When true, embeds the token directly in the clone URL (https://token:TOKEN@host/...)
# instead of using JGit's CredentialsProvider. Useful for proxied Git servers (e.g. GitHub
# Enterprise) where CredentialsProvider-based push fails. Per-repo tokens in repos.json
# take precedence over the global token regardless of this setting.
# git.auth.token.in.url=false
# For SSH repositories: keys are auto-discovered from ~/.ssh/ by default.
# Override the key file with ssh.key.path; provide the passphrase with ssh.passphrase.
# Set ssh.strict.host.key.checking=false to skip known_hosts verification (not recommended for production).
# ssh.key.path=
# ssh.passphrase=
# ssh.strict.host.key.checking=true

# Build settings
# build.enabled=true activates building artifacts in dependency order after cloning.
build.enabled=false
# build.mode: "snapshot" (default) builds with current -SNAPSHOT versions;
# "release" strips qualifiers, tags, builds, then bumps to next patch -SNAPSHOT.
# "patch" builds a patch between the last release and the next one: when the integration
# branch is created, 1.1.1-SNAPSHOT becomes 1.1.0.N-<branch>-SNAPSHOT (bare 1.1.0.N-SNAPSHOT for
# Lightspeed), N being the first number not yet released (requires lightspeed.maven-repo.releases-url).
build.mode=snapshot
# build.target=<repo-name> builds only that repo (plus downstream consumers with
# build.target.with-deps=true). build.target.update-deps (default true) still updates the
# target's dependencies on repos outside the build: to their current branch version, or in
# release mode to their released version (from the resume state, else the latest release in
# lightspeed.maven-repo.releases-url). Set false to leave those dependencies untouched.
# build.target.update-deps=true
# build.service selects the implementation: "local" (default) or "teamcity"
build.service=local
# Maven goals used by the local build service for Maven repos (space-separated)
build.maven.goals=clean install
# Gradle tasks used by the local build service for Gradle repos (space-separated). publishToMavenLocal
# plays the role of `mvn install`: downstream repos (Maven or Gradle) resolve the artifacts from ~/.m2.
# build.gradle.tasks=clean build publishToMavenLocal
# Gradle executable used when a repo has no wrapper (./gradlew). Blank = `gradle` from PATH.
# build.gradle.command=

# Lightspeed (Jenkins) settings — used when build.service=lightspeed or per-repo buildService=lightspeed.
# The service does not call Jenkins API directly; it polls the Maven repository until the built
# artifact appears (snapshot: updated maven-metadata.xml; release: artifact POM present).
# Snapshot trigger: injects a build.trigger.timestamp property into the root pom.xml, commits, and
# pushes to ensure Jenkins always receives a trigger commit.
# lightspeed.maven-repo.snapshots-url=https://nexus.example.com/repository/maven-snapshots
# lightspeed.maven-repo.releases-url=https://nexus.example.com/repository/maven-releases
# lightspeed.maven-repo.username=
# lightspeed.maven-repo.password=
# lightspeed.poll-interval-ms=20000
# lightspeed.timeout-ms=1800000

# TeamCity settings (only used when build.service=teamcity)
# teamcity.url=https://teamcity.example.com
# teamcity.token=your-access-token
# Pattern to derive the TeamCity build config ID from an artifact.
# Placeholders: {groupId}, {artifactId}, {version}
# teamcity.build-config-pattern={artifactId}
# teamcity.poll-interval-ms=5000
# teamcity.timeout-ms=600000
# Additional build parameters passed to every triggered TeamCity build (Spring map syntax).
# teamcity.build-parameters.system.myParam=value
# teamcity.build-parameters.env.MY_VAR=value
#teamcity.max-retries=2

# Path to a resume state file written by a previous failed run.
# When set, the build skips repos listed in the file and resumes from the first incomplete one.
# Defaults to <clone.dir>/.multibuild-resume.json (written automatically on failure).
# build.resume.state.file=

# Prefix prepended to every commit message made by this tool (e.g. a Jira ticket number).
# Required if your repo has a commit-msg hook that enforces a ticket prefix.
# commit.message.prefix=PROJ-123

# uDeploy (IBM UrbanCode Deploy) snapshot update is used by the update-snapshot command.
# Run: java -jar multibuild.jar update-snapshot repos.json
# Each entry in repos.json may also carry a "udeployComponent" field naming the uDeploy
# component that represents that repository. Repos without the field are silently skipped.
#
# udeploy.url=https://udeploy.example.com
# udeploy.username=admin
# udeploy.password=secret
#
# Application that owns the snapshot to be updated.
# udeploy.application=MyApplication
#
# Name of the snapshot to update.
# udeploy.snapshot=DevSnapshot
#
# Regex matched against component version names when build.mode=snapshot.
# The latest version (by position in the uDeploy version list) whose name matches wins.
# Example: match any version that contains the integration branch name.
# udeploy.version-pattern-snapshot=.*feature-branch.*SNAPSHOT.*
#
# Regex matched against component version names when build.mode=release.
# Example: plain three-part numeric versions only.
# udeploy.version-pattern-release=\d+\.\d+\.\d+

# analyze command: prints the component dependency graph and build order.
# Run: java -jar multibuild.jar analyze repos.json
# Repos are cloned (or reused) and checked out on their source branch; nothing is committed or pushed.
# With skip.git=true the repos already in clone.dir are analyzed as they are.
# analyze.target=<repo-name> limits the output to the subgraph around that component (blank = all).
# analyze.scope: "downstream" (default) — target + everything depending on it (same set as
#                build.target.with-deps=true); "upstream" — target + everything it depends on; "both".
# analyze.format: "ascii" (default) or "plantuml".
# analyze.output: file to write the result to (blank = stdout).
# analyze.branch: branch to analyze in every repo (blank = each repo's source branch).
# analyze.target=
# analyze.scope=downstream
# analyze.format=ascii
# analyze.output=
# analyze.branch=

# migrate-gradle command: converts Maven repos to Gradle.
# Run: java -jar multibuild.jar migrate-gradle repos.json
# Every build feature (build, release, patch, analyze, Lightspeed/TeamCity/local builds) works with
# Gradle repos, and with estates where some repos are still on Maven.
# Per repo: the poms are converted (settings.gradle, gradle.properties with group/version/dependency
# version properties, build.gradle per module, maven-publish everywhere), pom.xml files and the Maven
# wrapper are removed, and the result is verified to publish the same artifacts with the same external
# dependencies — so the cross-repo graph and build order are unchanged. On mismatch the repo is rolled
# back and reported as failed. Constructs without a generated equivalent (build plugins, profiles,
# system-scoped dependencies) are listed as warnings for manual follow-up.
# The migration is committed on migrate.branch (created from the source branch, versions untouched);
# when blank, on the integration branch, created like the build command does (-<branch>-SNAPSHOT
# versions). Then open PRs with create-prs. Repos already on Gradle are skipped. Respects dry.mode and
# per-repo dryRun (commit without push); with skip.git=true only the local working trees are converted.
# migrate.branch=
# migrate.reset=true starts the migration over: per repo the migrate.branch is deleted locally and on
# origin (closing its pull request), the clone is cleaned and the migration runs again from the source
# branch. Needs an explicit migrate.branch (the integration branch is never deleted). A branch with commits
# other than the migration's own (manual fixes) is refused unless migrate.reset.force=true. If the source
# branch itself already contains the migration (PR merged), its migration commits are reverted on the new
# branch so the migration starts from the Maven build again; the source branch is not modified, and a
# revert conflict (generated files edited afterwards) stops that repo with an explanation. With dry.mode
# only the local branch is reset — origin is left untouched; run without dry.mode to replace it.
# migrate.reset=false
# migrate.reset.force=false
# migrate.target: comma-separated repo names to migrate (blank = all repos in repos.json).
# migrate.target=
# migrate.keep.maven: true keeps pom.xml files and the Maven wrapper next to the generated Gradle build
# until the migration is complete. Gradle takes priority (it is parsed and built); version bumps,
# dependency updates and the Lightspeed trigger are applied to both so the Maven build stays a working
# fallback (e.g. for CI pipelines not switched yet). Running migrate-gradle again without it removes the
# Maven files from repos whose Gradle build was generated by migrate-gradle.
# migrate.keep.maven=false
# Annotation processing: modules whose pom (or a parent) declares maven-compiler-plugin without
# <annotationProcessorPaths> get Maven's implicit processing — the Gradle processor paths extend the compile
# configurations, so every processor on the classpath runs. <annotationProcessorPaths> become explicit
# annotationProcessor dependencies; <proc>none</proc>, <parameters> and <compilerArgs> are carried over.
# migrate.gradle.dsl: "groovy" (default, build.gradle) or "kotlin" (build.gradle.kts).
# Scopes, optional flags and exclusions declared in dependencyManagement are applied to dependencies that
# omit them (e.g. a managed <scope>test</scope> → testImplementation), including management inherited
# from external parents and imported BOMs. Those poms are read from the local Maven repository:
# maven.repo.local, else <localRepository> in ~/.m2/settings.xml, else ~/.m2/repository. If one is
# missing, the affected dependencies get a warning — run `mvn dependency:resolve` in the repo first.
# maven.repo.local=
# migrate.gradle.dsl=groovy
# migrate.gradle.layout: "build-logic" (default) or "root-script".
#   build-logic: gradle/libs.versions.toml holds every external dependency (Maven version properties become
#     [versions] entries, e.g. spring.version → spring); an included build-logic/ build holds precompiled
#     convention plugins: <prefix>.java-conventions (java-library), <prefix>.lombok-conventions (Lombok for
#     main and test code, see migrate.gradle.lombok.scope),
#     <prefix>.publishing-conventions (maven-publish; the repo's distributionManagement, defined once),
#     one <prefix>.<parent-artifactId>-conventions per in-repo parent pom (its dependencies, managed versions,
#     Java version, compiler settings and build plugins) and one per third-party Gradle plugin a module uses.
#     Modules apply their parent's convention and declare their own dependencies as libs.<alias>.
#     Maven plugins are translated: surefire/failsafe (integrationTest task), jar manifest, source/javadoc
#     jars, war, resources encoding, jacoco, checkstyle, pmd, gpg → signing, build-helper source dirs,
#     spring-boot-maven-plugin → org.springframework.boot, maven-shade-plugin → com.gradleup.shadow,
#     spotbugs-maven-plugin → com.github.spotbugs. Others get a TODO comment in the script and a warning.
#     In-repo BOM modules stay java-platform projects so other repos importing them keep working.
#     A <parent> pom in another repo of clone.dir works like a Maven parent: the parent repo publishes its
#     build-logic with its modules (publish / publishToMavenLocal, same group and version, one plugin marker
#     per convention), and the child repo's build-logic depends on the parent's convention at the parent's
#     version (shared with platform(parent) in the catalog, so version bumps move both); the child's
#     conventions build on it instead of generating base / publishing conventions of their own. Both repos
#     must be in clone.dir when migrating (any order); the parent must be published before the child builds.
#   root-script: versions in gradle.properties, parent configuration in blocks of the root build script.
# migrate.gradle.layout=build-logic
# migrate.gradle.conventions.prefix: prefix of the convention plugin ids (blank = last segment of the root
# groupId, e.g. com.acme → acme.java-conventions).
# migrate.gradle.conventions.prefix=
# migrate.gradle.lombok.version: Lombok version for the base convention when no pom (or imported BOM) sets one.
# migrate.gradle.lombok.version=1.18.48
# migrate.gradle.lombok.scope: "used" (default) — only modules whose pom uses Lombok (dependency or
# annotationProcessorPaths) apply <prefix>.lombok-conventions; a parent pom with Lombok in <dependencies>
# applies it in its convention, so all its children get it as in Maven. "all" — Lombok in the base
# convention of every Java module.
# migrate.gradle.lombok.scope=used
# migrate.gradle.plugin.repository: repository build-logic resolves Gradle plugins from (e.g. an Artifactory
# remote of plugins.gradle.org); blank = gradlePluginPortal() + mavenCentral().
# migrate.gradle.plugin.repository=
# Add the Gradle wrapper (gradlew, gradlew.bat, gradle/wrapper/*). Gradle does NOT need to be installed:
# the wrapper files are copied from migrate.gradle.wrapper.template (a directory with an existing wrapper,
# e.g. any Gradle repo), else downloaded once from migrate.gradle.wrapper.source into
# migrate.gradle.wrapper.cache, else generated with `gradle wrapper` if gradle is on PATH.
# Repos already on Gradle but missing the wrapper get it added (and committed) on the next run.
# gradlew downloads Gradle itself on first use from migrate.gradle.distribution.url — point it at an
# internal mirror (Nexus/Artifactory) if services.gradle.org is blocked. {version} = migrate.gradle.version.
# migrate.gradle.wrapper=true
# migrate.gradle.version=8.10.2
# migrate.gradle.wrapper.template=
# migrate.gradle.wrapper.source=https://raw.githubusercontent.com/gradle/gradle/v{version}
# migrate.gradle.wrapper.cache=${user.home}/.multibuild/gradle-wrapper
# migrate.gradle.distribution.url=https://services.gradle.org/distributions/gradle-{version}-bin.zip

spring.config.import=optional:file:./user.properties